      <stop offset="0" stop-color="#a7ff6b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a7ff6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="92%" cy="22%" r="50%">
      <stop offset="0" stop-color="#8ed8ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#8ed8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e100c"/>
